<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art of Living - Bengaluru Centers</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; 
                   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
                   font-src https://fonts.gstatic.com;">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; padding: 60px 0; }
        .center-card { border: none; border-radius: 15px; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .center-card:hover { transform: translateY(-5px); }
        .btn-aol { background-color: #f37021; color: white; border-radius: 8px; font-weight: 600; }
        .btn-aol:hover { background-color: #d35400; color: white; }
        .search-container { margin-top: -30px; }
    </style>
</head>
<body>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Art of Living Centers - Bengaluru</h1>
            <p class="lead text-white-50">Find your nearest center/teacher across Bengaluru</p>
        </div>
    </header>

    <div class="container search-container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-pill p-2">
                    <input type="text" id="searchBox" class="form-control form-control-lg border-0 rounded-pill ps-4" 
                           placeholder="Search area (e.g. 'Koramangala' or 'Teachers in Jayanagar')...">
                </div>
                <div id="results-count" class="text-center mt-3 text-muted small"></div>
            </div>
        </div>
    </div>

    <main class="container my-5">
        <div id="centers-grid" class="row g-4">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2">Initializing secure connection...</p>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="app.js"></script>
</body>
</html>
