<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art of Living - Bengaluru Centers</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .text-orange { color: #ff7e5f !important; }
        .btn-dark { background-color: #333 !important; border: none; }
        .logo {
            width: 150px;
            display: block;
            margin: 27px auto 7px auto;
        }
    </style>
    
    <!--<meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; 
                   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
                   font-src https://fonts.gstatic.com;"> -->

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; padding: 60px 0; }
        .center-card { border: none; border-radius: 15px; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .center-card:hover { transform: translateY(-5px); }
        .btn-aol { background-color: #f37021; color: white; border-radius: 8px; font-weight: 600; }
        .btn-aol:hover { background-color: #d35400; color: white; }
        .search-container { margin-top: -30px; }
    </style>
</head>
<body>
    <img src="Art-of-Living_Logo.png" alt="Art of Living Logo" class="logo">
    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Art of Living Centers - Bengaluru</h1>
            <p class="lead text-black-50">Connect with your nearest center/teacher across Bengaluru</p>
        </div>
    </header>

    <div class="container search-container">
        <div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-center flex-wrap gap-3 mb-3">
            <div class="form-check text-white">
                <input class="form-check-input" type="radio" name="searchMode" id="modeArea" value="area" checked>
                <label class="form-check-label small" for="modeArea">Area</label>
            </div>
            <div class="form-check text-white">
                <input class="form-check-input" type="radio" name="searchMode" id="modeTeacher" value="teacher">
                <label class="form-check-label small" for="modeTeacher">Teacher</label>
            </div>
            <div class="form-check text-white">
                <input class="form-check-input" type="radio" name="searchMode" id="modePincode" value="pincode">
                <label class="form-check-label small" for="modePincode">Pincode</label>
            </div>
        </div>
        
        <div class="position-relative max-w-md mx-auto">
            <input type="text" id="searchBox" class="form-control form-control-lg rounded-pill shadow-sm pe-5" 
                   placeholder="Enter Area Name...">
            <button id="clearSearch" class="btn position-absolute end-0 top-50 translate-middle-y me-2 text-muted border-0" 
                    style="display: none; z-index: 10;">
                <i class="bi bi-x-circle-fill"></i>
            </button>
        </div>
    </div>
</div>
    </div>

    <main class="container my-5">
        <div id="centers-grid" class="row g-4">
            <div class="text-center py-5 text-muted">
                <p class="mt-2">Please type at least 3 characters...</p>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="app.js"></script>
</body>
<footer>
    <div class="container text-center py-4">
        <p class="small text-muted mb-0">Developed by Art of Living Volunteer - For feedback, please whatsapp 
            <a href="https://wa.me/919886696718" title="Message on WhatsApp" target="_blank" class="ms-2 text-success" style="font-size:1.1em;">
                <i class="bi bi-whatsapp"></i>
            </a>
        </p>
    </div>
</footer>
</html>
