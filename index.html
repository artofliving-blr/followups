<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;">
    <title>Art of Living - Bengaluru Centers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-orange-500 text-white p-8 text-center shadow-lg">
        <h1 class="text-3xl font-bold mb-2">Find a Center/Teacher in Bengaluru</h1>
        <p class="opacity-90 mb-6">Happiness & Inner Peace is just a search away. Find Art of Living centers/teachers across Bengaluru.</p>
        
        <div class="max-w-md mx-auto relative">
            <input type="text" id="searchBox" placeholder="Search area, teacher, or 'center in Jayanagar'..." 
                   class="w-full p-4 rounded-full text-gray-800 shadow-inner focus:outline-none focus:ring-2 focus:ring-orange-300">
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div id="results-count" class="text-gray-500 mb-4 text-sm"></div>
        <div id="centers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
